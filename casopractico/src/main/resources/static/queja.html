<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="base :: content">
<head>
    <title>Quejas y Sugerencias</title>
</head>
<body>
    <section>
        <h2>Envía tu Queja o Sugerencia</h2>
        <form action="/quejas/enviar" method="post">
            <label>Nombre:</label>
            <input type="text" name="nombre" required>
            <label>Email:</label>
            <input type="email" name="email" required>
            <label>Mensaje:</label>
            <textarea name="mensaje" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
